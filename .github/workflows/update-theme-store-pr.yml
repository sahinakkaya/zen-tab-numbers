name: Update existing Theme Store PR

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tab-numbers repo
        uses: actions/checkout@v4

      - name: Find open theme-store PR branch
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.THEME_STORE_PAT }}
        run: |
          PR_JSON=$(gh pr list --repo zen-browser/theme-store --author philmard --state open --json number,headRefName --limit 1)
          BRANCH=$(echo "$PR_JSON" | jq -r '.[0].headRefName')
          NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
          if [ "$BRANCH" = "null" ] || [ -z "$BRANCH" ]; then
            echo "No open PR found against zen-browser/theme-store"
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Found open PR #$NUMBER on branch $BRANCH"

      - name: Clone theme-store fork and update files
        env:
          GH_TOKEN: ${{ secrets.THEME_STORE_PAT }}
        run: |
          git clone --depth 1 --branch "${{ steps.find-pr.outputs.branch }}" \
            https://x-access-token:${{ secrets.THEME_STORE_PAT }}@github.com/philmard/theme-store.git theme-store

          THEME_DIR="theme-store/themes/22c9ec3b-7c62-46ae-991f-c8fff5046829"
          cp chrome.css "$THEME_DIR/chrome.css"
          cp preferences.json "$THEME_DIR/preferences.json"
          cp theme.json "$THEME_DIR/theme.json"

          cd theme-store
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update theme files"
          git push origin "${{ steps.find-pr.outputs.branch }}"
          echo "Updated PR #${{ steps.find-pr.outputs.number }}"
