name: Deploy to Zen Theme Store

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tab-numbers repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.THEME_STORE_PAT }}

      - name: Bump patch version in theme.json
        id: version
        run: |
          CURRENT=$(jq -r '.version' theme.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          jq --arg v "$NEW_VERSION" '.version = $v' theme.json > theme.json.tmp && mv theme.json.tmp theme.json
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $CURRENT → $NEW_VERSION"

      - name: Commit version bump back to tab-numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add theme.json
          git commit -m "v${{ steps.version.outputs.version }}"
          git push

      - name: Clone theme-store fork
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.THEME_STORE_PAT }}@github.com/philmard/theme-store.git theme-store

      - name: Sync theme-store fork with upstream
        run: |
          cd theme-store
          git remote add upstream https://github.com/zen-browser/theme-store.git
          git fetch upstream
          git merge upstream/main --no-edit
          git push origin main

      - name: Copy theme files to theme-store
        run: |
          THEME_DIR="theme-store/themes/22c9ec3b-7c62-46ae-991f-c8fff5046829"
          cp chrome.css "$THEME_DIR/chrome.css"
          cp preferences.json "$THEME_DIR/preferences.json"
          cp theme.json "$THEME_DIR/theme.json"

      - name: Create PR to zen-browser/theme-store
        env:
          GH_TOKEN: ${{ secrets.THEME_STORE_PAT }}
        run: |
          cd theme-store
          BRANCH="update-tab-numbers-v${{ steps.version.outputs.version }}"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Tab Numbers to v${{ steps.version.outputs.version }}"
          git push origin "$BRANCH"
          gh pr create \
            --repo zen-browser/theme-store \
            --head "philmard:$BRANCH" \
            --title "Update Tab Numbers to v${{ steps.version.outputs.version }}" \
            --body "Update Tab Numbers theme to v${{ steps.version.outputs.version }}"
